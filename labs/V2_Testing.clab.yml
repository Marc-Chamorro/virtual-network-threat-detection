name: virtual-env

topology:
  nodes:
    switch_vlan40:
      kind: arista_ceos
      image: ceos_vntd:latest
      startup-config: ./config/switch/enterprise/config_v40.cli

    internal_server:
      kind: linux
      image: server_vntd:latest
      env: 
        SSH_SERVER: 1
        DHCP_SERVER: 1
        IFACE: "eth1"                                           # DHCP config required env variable
        IP_ADDR: "192.168.40.10"                                # DHCP config required env variable
        FTP_SERVER: 1
      binds:
       - ./config/server/dhcp/dhcpd.conf:/etc/dhcp/dhcpd.conf
       - ./config/server/dhcp/isc-dhcp-server:/etc/default/isc-dhcp-server
       - ./config/server/ftp/vsftpd.conf:/etc/vsftpd.conf
       - ./config/server/ftp/vsftpd.chroot_list:/etc/vsftpd.chroot_list
      exec:
        - ip addr add 192.168.40.10/24 dev eth1
        - ip link set eth1 up
        - ip route del default
        - ip route add default via 192.168.40.1

  links:
    - endpoints: ["switch_vlan40:eth2", "internal_server:eth1"]

