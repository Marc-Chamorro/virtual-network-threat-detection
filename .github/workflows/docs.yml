name: Deploy Docs

on:
  push:
    branches: [ main, docs, restructure, services ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENABLE_PDF: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wkhtmltopdf \
            xvfb \
            fonts-dejavu \
            fontconfig

      - name: Install dependencies
        run: |
          pip install \
            mkdocs==1.5.3 \
            mkdocs-material==9.5.3 \
            mkdocs-exporter==6.2.0

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps

      - name: Build site with PDF
        run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
