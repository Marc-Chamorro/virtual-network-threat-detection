name: Deploy Docs

on:
  push:
    branches: [ main, docs, restructure, services ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENABLE_PDF: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wkhtmltopdf \
            xvfb \
            fonts-dejavu \
            fontconfig

      - name: Install MkDocs and plugins
        run: |
          pip install \
            mkdocs==1.5.3 \
            mkdocs-material[imaging]==9.5.3

      - name: Build site
        run: mkdocs build

      - name: Generate PDF with wkhtmltopdf
        run: |
          mkdir -p site/assets/pdf
          xvfb-run wkhtmltopdf \
            --enable-local-file-access \
            --no-stop-slow-scripts \
            --javascript-delay 1000 \
            file://$(pwd)/site/index.html \
            site/assets/pdf/vntd-docs.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
